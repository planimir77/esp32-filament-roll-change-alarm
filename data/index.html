<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLA • Контролен панел</title>
<link rel="stylesheet" href="/stylesheets/main.css"><script src="/index.js" defer></script>
</head>
<body><main>
<header><p class="eyebrow">PLA EXTRUDER</p><h1>Контролен панел</h1>
<p id="connection" role="status">Свързване с устройството…</p></header>
<section class="grid" aria-label="Състояние на устройството">
<article><h2>Лампа</h2><p class="value" id="lamp">—</p></article>
<article><h2>Бузер</h2><p class="value" id="buzzer">—</p></article>
<article class="wide"><h2>Заглушаване</h2><p class="value" id="remaining">—</p>
<progress id="progress" value="0" max="30" aria-label="Оставащо време"></progress>
<button id="mute" disabled>Заглуши за 30 секунди</button>
<p id="action" role="status">Работи и с физическия бутон на устройството.</p></article>
<article class="wide"><h2>Последно успешно изпратено известие</h2>
<p id="notification">—</p><p class="muted" id="notification-age">Данни от текущото стартиране.</p></article>
<article><h2>Wi-Fi сигнал</h2><p class="value" id="wifi">—</p></article>
<article><h2>Време от стартирането</h2><p class="value" id="uptime">—</p></article>
</section><footer>Автоматично обновяване всяка секунда.</footer>
</main></body></html>
